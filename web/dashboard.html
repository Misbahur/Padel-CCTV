<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard Admin — Padel CCTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#e9efee; --surface:#ffffff; --fg:#13201e; --muted:#5a6b68; --line:#d3dcda;
  --accent:#1d6a8f; --accent-fg:#ffffff; --court:#cfdde3;
  --b-bg:#0b2742; --b-row:#0f3050; --b-fg:#eaf2f8; --ball:#dcef3f;
  --f-board:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --danger:#c0473a; --ok-color:#2a9d5a; --warn:#d98a1c;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1416; --surface:#151f22; --fg:#e4ecec; --muted:#93a4a6;
  --line:#263336; --accent:#5fb4dc; --accent-fg:#06202c; --court:#12232b; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.page{max-width:960px;margin:0 auto;padding:0 16px 48px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* Header */
.site-header{background:var(--b-bg);color:var(--b-fg);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.site-header .logo{font-family:var(--f-board);font-size:22px;font-weight:700;letter-spacing:.04em;flex:1}
.site-header .logo span{color:var(--ball)}
.site-header button{background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:7px;color:var(--b-fg);padding:7px 14px;cursor:pointer;font:600 13px var(--f-ui);transition:border-color .15s}
.site-header button:hover{border-color:var(--ball)}

/* Section */
section{margin-top:28px}
.sec-title{font-family:var(--f-board);font-size:12px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}

/* Court status grid */
.court-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.court-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.court-card .cname{font-family:var(--f-board);font-size:20px;font-weight:700;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px}
.status-badge.rec{background:color-mix(in srgb,#ff4d4d 16%,transparent);color:#e63c3c}
.status-badge.rec i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff4d4d;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.status-badge.idle{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}
.score-info{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-height:18px}
.cam-row{display:flex;flex-wrap:wrap;gap:6px}
.cam-chip{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.ok{background:var(--ok-color)}.dot.on{background:#e23b3b}.dot.err{background:var(--warn)}.dot.conn{background:var(--warn)}
.open-btn{margin-top:4px;background:var(--accent);color:var(--accent-fg);border:none;border-radius:8px;padding:8px 14px;font:600 14px var(--f-board);letter-spacing:.04em;cursor:pointer;align-self:flex-start;text-decoration:none;display:inline-block}
.open-btn:hover{opacity:.88;text-decoration:none}

/* Panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.panel h3{font-family:var(--f-board);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}

/* Accordion tabs */
.acc-tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;align-self:flex-start}
.acc-tabs button{background:var(--bg);border:none;padding:8px 14px;font:600 13px var(--f-ui);color:var(--muted);cursor:pointer;transition:all .12s}
.acc-tabs button.active{background:var(--accent);color:var(--accent-fg)}
.court-tab{display:none;flex-direction:column;gap:14px}
.court-tab.active{display:flex}

/* Cameras list */
.cams{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cams li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:9px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);align-items:center;flex-wrap:wrap}
.cams .camname{font-weight:500;display:flex;align-items:center;gap:7px}
.cams .caminfo{color:var(--muted);font-family:var(--f-mono);font-size:12px;word-break:break-word;text-align:right;flex:1}
button.sm{padding:4px 10px;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer;font-weight:600}
button.sm:hover{border-color:var(--accent)}
button.sm.danger{border-color:var(--danger);color:var(--danger)}

/* Add camera form */
details.addcam{border-top:1px solid var(--line);padding-top:14px}
details.addcam summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:6px}
details.addcam summary::before{content:"＋";font-size:16px;color:var(--accent)}
.addin{display:flex;flex-direction:column;gap:12px;margin-top:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;transition:border-color .15s}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--fg);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:600;transition:border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.ghost{background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.chips button{padding:5px 10px;font-weight:500;font-size:12px;font-family:var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px}
.live{font-size:13px;padding:8px 10px;border-radius:7px;background:var(--bg);border:1px dashed var(--line);font-family:var(--f-mono)}

/* Recent files */
.files{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0;padding-left:18px;word-break:break-all}
.renders-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.renders-list li{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:7px 10px;border-radius:7px;background:var(--bg);border:1px solid var(--line)}

/* Settings */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.settings-section{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}
.settings-section h4{font-family:var(--f-board);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.msg{font-size:13px;padding:7px 10px;border-radius:6px;margin-top:4px}
.msg.ok{background:color-mix(in srgb,var(--ok-color) 13%,transparent);color:var(--ok-color)}
.msg.err{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
@media(max-width:420px){.grid2{grid-template-columns:1fr}.court-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="logo">🎾 Padel <span>CCTV</span> — Dashboard Admin</div>
  <button onclick="doLogout()">Keluar</button>
</header>

<div class="page">

  <!-- Section 1: Status Lapangan -->
  <section>
    <p class="sec-title">Status Lapangan</p>
    <div class="court-grid" id="courtGrid">
      <div class="court-card"><div class="cname">Memuat…</div></div>
    </div>
  </section>

  <!-- Section 2: Konfigurasi Kamera -->
  <section>
    <p class="sec-title">Konfigurasi Kamera</p>
    <div class="panel">
      <div class="acc-tabs" id="camTabs">
        <button class="active" onclick="switchCourtTab(1)">Lapangan 1</button>
        <button onclick="switchCourtTab(2)">Lapangan 2</button>
        <button onclick="switchCourtTab(3)">Lapangan 3</button>
      </div>
      <div class="court-tab active" id="camTab1" data-court="1"></div>
      <div class="court-tab" id="camTab2" data-court="2"></div>
      <div class="court-tab" id="camTab3" data-court="3"></div>
    </div>
  </section>

  <!-- Section 3: Rekaman -->
  <section>
    <p class="sec-title">Rekaman &amp; Render Video</p>
    <div class="panel">
      <div class="acc-tabs" id="recTabs">
        <button class="active" onclick="switchRecTab(1)">Lapangan 1</button>
        <button onclick="switchRecTab(2)">Lapangan 2</button>
        <button onclick="switchRecTab(3)">Lapangan 3</button>
      </div>
      <div id="recContent">Memuat…</div>
    </div>
  </section>

  <!-- Section 4: Pengaturan -->
  <section>
    <p class="sec-title">Pengaturan</p>

    <!-- Ganti Password Admin -->
    <div class="panel" style="margin-bottom:16px">
      <h3>Ganti Password Admin</h3>
      <div class="grid2">
        <label>Password Baru
          <input type="password" id="newAdminPw" placeholder="Minimal 6 karakter" autocomplete="new-password">
        </label>
        <label>Konfirmasi
          <input type="password" id="confirmAdminPw" placeholder="Ulangi password" autocomplete="new-password">
        </label>
      </div>
      <div class="row3">
        <button class="btn primary" onclick="changeAdminPw()">Simpan Password</button>
      </div>
      <div id="adminPwMsg" hidden></div>
    </div>

    <!-- Ganti PIN Lapangan -->
    <div class="panel" style="margin-bottom:16px">
      <h3>Ganti PIN Lapangan</h3>
      <div class="grid2" style="align-items:end">
        <label>Lapangan
          <select id="pinCourtSel">
            <option value="1">Lapangan 1</option>
            <option value="2">Lapangan 2</option>
            <option value="3">Lapangan 3</option>
          </select>
        </label>
        <label>PIN Baru (4 digit)
          <input type="password" id="newPin" placeholder="4 digit angka" maxlength="4" inputmode="numeric" autocomplete="new-password">
        </label>
      </div>
      <div class="row3">
        <button class="btn primary" onclick="changePin()">Simpan PIN</button>
      </div>
      <div id="pinMsg" hidden></div>
    </div>

    <!-- Overlay Settings per lapangan -->
    <div class="panel">
      <h3>Pengaturan Overlay Video</h3>
      <div class="acc-tabs" id="overlayTabs">
        <button class="active" onclick="switchOverlayTab(1)">Lapangan 1</button>
        <button onclick="switchOverlayTab(2)">Lapangan 2</button>
        <button onclick="switchOverlayTab(3)">Lapangan 3</button>
      </div>
      <div id="overlayContent">Memuat…</div>
    </div>
  </section>

</div><!-- /page -->

<script>
const $=id=>document.getElementById(id);

// ── API ──────────────────────────────────────────────────────────────────────
async function api(path, body, method) {
  try {
    const opts = body !== undefined
      ? {method: method||'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}
      : {method: method||'GET'};
    const r = await fetch(path, opts);
    if (r.status === 401) { location.href = '/login?next=/dashboard'; return null; }
    return r.ok ? await r.json() : null;
  } catch { return null; }
}

function esc(s) { return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ── Logout ───────────────────────────────────────────────────────────────────
async function doLogout() {
  await api('/api/auth/logout', {});
  location.href = '/login';
}

// ── Status Lapangan ──────────────────────────────────────────────────────────
let allStatus = {};
async function refreshStatus() {
  const r = await api('/api/admin/status');
  if (!r) return;
  allStatus = r.courts || {};
  renderCourtGrid();
  renderRecTab(activeRecTab);
}

function camDotClass(c) {
  if (c.recording) return 'on';
  if (c.error) return 'err';
  if (c.connecting) return 'conn';
  return 'ok';
}

function renderCourtGrid() {
  const grid = $('courtGrid');
  const ids = Object.keys(allStatus).sort();
  if (!ids.length) { grid.innerHTML = '<p style="color:var(--muted)">Tidak ada data.</p>'; return; }
  grid.innerHTML = ids.map(id => {
    const s = allStatus[id];
    const recBadge = s.recording
      ? `<span class="status-badge rec"><i></i> MEREKAM</span>`
      : `<span class="status-badge idle">Siaga</span>`;
    const stopInfo = s.stopping_in != null ? ` · berhenti dalam ${s.stopping_in}d` : '';
    const camChips = (s.cameras||[]).map(c =>
      `<span class="cam-chip"><span class="dot ${camDotClass(c)}"></span>${esc(c.name)}</span>`
    ).join('') || '<span style="color:var(--muted);font-size:12px">Belum ada kamera</span>';
    return `
      <div class="court-card">
        <div class="cname">${esc(s.court_name||'Lapangan '+id)} ${recBadge}</div>
        <div class="score-info">${s.recording?`Merekam ${Math.floor(s.elapsed/60).toString().padStart(2,'0')}:${(s.elapsed%60).toString().padStart(2,'0')}${stopInfo}`:'—'}</div>
        <div class="cam-row">${camChips}</div>
        <a class="open-btn" href="/court/${id}" target="_blank">Buka Papan Skor ↗</a>
      </div>`;
  }).join('');
}

// ── Camera Tabs ──────────────────────────────────────────────────────────────
let activeCamTab = 1;
function switchCourtTab(n) {
  activeCamTab = n;
  $('camTabs').querySelectorAll('button').forEach((b,i) => b.classList.toggle('active', i===n-1));
  [1,2,3].forEach(i => { const el=$('camTab'+i); if(el) el.classList.toggle('active', i===n); });
  renderCamTab(n);
}

function renderCamTab(n) {
  const el = $('camTab'+n); if (!el) return;
  const s = allStatus[n] || {};
  const cams = s.cameras || [];
  const isRec = s.recording || false;

  const camList = cams.length
    ? `<ul class="cams">${cams.map(c => `<li>
        <span class="camname"><span class="dot ${camDotClass(c)}"></span>${esc(c.name)}</span>
        <span class="caminfo">${c.error ? esc(c.error) : c.recording ? esc(c.file)+' · '+c.mb+' MB' : c.connecting ? 'menghubungkan…' : c.placeholder ? 'placeholder — isi RTSP' : 'siaga'}</span>
        ${!isRec ? `<button class="sm danger" onclick="removeCam(${n},'${esc(c.name)}',this)">Hapus</button>` : ''}
      </li>`).join('')}</ul>`
    : `<p style="color:var(--muted);font-size:14px;margin:0">Belum ada kamera untuk lapangan ini.</p>`;

  el.innerHTML = `
    ${camList}
    <div class="row3">
      <button class="btn ghost" onclick="testCams(${n},this)">Tes Kamera</button>
    </div>
    <div class="live" id="testMsg${n}" hidden></div>
    <details class="addcam" id="addcam${n}">
      <summary>Tambah kamera (ONVIF)</summary>
      <div class="addin">
        <p class="live" style="margin:0;font-size:12px">Untuk CCTV Bardi: buka aplikasi Bardi › kamera › Pengaturan › ONVIF, aktifkan, buat password ONVIF (username: admin).</p>
        <div class="grid2">
          <label>Nama kamera<input type="text" id="camName${n}" placeholder="Kamera Utama" autocomplete="off"></label>
          <label>IP kamera<input type="text" id="camIp${n}" placeholder="192.168.1.50" inputmode="decimal" autocomplete="off"></label>
          <label>Username<input type="text" id="camUser${n}" value="admin" autocomplete="off"></label>
          <label>Password ONVIF<input type="password" id="camPass${n}" autocomplete="off"></label>
        </div>
        <div class="chips" id="found${n}"></div>
        <div class="row3">
          <button class="btn ghost" onclick="discoverCams(${n},this)">Cari kamera di jaringan</button>
          <button class="btn primary" onclick="addCam(${n},this)">Cek &amp; simpan</button>
        </div>
        <div class="live" id="addMsg${n}" hidden></div>
      </div>
    </details>`;
  setupFoundChips(n);
}

function setupFoundChips(n) {
  const fc = $('found'+n);
  if (fc) fc.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) { $('camIp'+n).value = b.dataset.ip; $('camPass'+n).focus(); }
  });
}

async function removeCam(courtId, name, btn) {
  if (btn.dataset.armed !== '1') {
    btn.dataset.armed = '1'; btn.textContent = 'Yakin?';
    setTimeout(() => { btn.dataset.armed=''; btn.textContent='Hapus'; }, 3000);
    return;
  }
  await api(`/api/court/${courtId}/remove-camera`, {name});
  await refreshStatus();
  renderCamTab(activeCamTab);
}

async function testCams(n, btn) {
  btn.disabled = true; btn.textContent = 'Mengetes…';
  const r = await api(`/api/court/${n}/test`, {});
  btn.disabled = false; btn.textContent = 'Tes Kamera';
  const msg = $('testMsg'+n);
  if (!r) { msg.hidden=false; msg.textContent='Gagal terhubung ke server.'; return; }
  msg.hidden = false;
  msg.innerHTML = r.results.length
    ? r.results.map(c => `<div><span class="dot ${c.ok?'ok':'err'}" style="display:inline-block;margin-right:6px"></span>${esc(c.name)}: ${c.ok?'terhubung · ':''}${esc(c.info)}</div>`).join('')
    : 'Belum ada kamera.';
}

async function discoverCams(n, btn) {
  btn.disabled = true; btn.textContent = 'Mencari…';
  const r = await api(`/api/court/${n}/discover`, {});
  btn.disabled = false; btn.textContent = 'Cari kamera di jaringan';
  const addMsg = $('addMsg'+n); const found = $('found'+n);
  if (!r) { addMsg.hidden=false; addMsg.textContent='Server tidak terhubung.'; return; }
  if (!r.cameras.length) { addMsg.hidden=false; addMsg.textContent='Tidak ada kamera ONVIF yang menjawab.'; found.innerHTML=''; return; }
  found.innerHTML = r.cameras.map(c => `<button class="btn" style="padding:5px 10px;font-size:12px;font-family:var(--f-mono)" data-ip="${esc(c.ip)}">${esc(c.ip)}${c.name?' · '+esc(c.name):''}</button>`).join('');
  addMsg.hidden=false; addMsg.textContent = r.cameras.length+' kamera ditemukan.';
}

async function addCam(n, btn) {
  btn.disabled = true; btn.textContent = 'Mengecek…';
  const addMsg = $('addMsg'+n);
  addMsg.hidden=false; addMsg.textContent='Mencoba alamat RTSP… bisa sampai 1 menit.';
  const r = await api(`/api/court/${n}/add-camera`, {
    name: $('camName'+n).value,
    ip: $('camIp'+n).value,
    user: $('camUser'+n).value,
    password: $('camPass'+n).value
  });
  btn.disabled = false; btn.textContent = 'Cek & simpan';
  if (!r) { addMsg.textContent='Server tidak terhubung.'; return; }
  if (r.ok) {
    addMsg.textContent = `Tersimpan: ${r.name} (${r.label}, ${r.info}).`;
    $('camPass'+n).value=''; $('camName'+n).value='';
    await refreshStatus(); renderCamTab(n);
  } else addMsg.textContent = r.message;
}

// ── Rekaman Tabs ─────────────────────────────────────────────────────────────
let activeRecTab = 1;
function switchRecTab(n) {
  activeRecTab = n;
  $('recTabs').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===n-1));
  renderRecTab(n);
}

function renderRecTab(n) {
  const el = $('recContent'); if (!el) return;
  const s = allStatus[n];
  if (!s) { el.innerHTML = '<p style="color:var(--muted)">Tidak ada data.</p>'; return; }
  const recent = s.recent || [];
  const renders = s.renders || [];
  el.innerHTML = `
    <p style="margin:0;font-size:13px;color:var(--muted)">Folder: <code>${esc(s.folder||'—')}</code></p>
    ${recent.length ? `<ol class="files">${recent.map(f=>`<li>${esc(f)}</li>`).join('')}</ol>` : '<p style="font-size:13px;color:var(--muted);margin:0">Belum ada rekaman.</p>'}
    ${renders.length ? `<ul class="renders-list">${renders.map(j=>`<li>
      <span><span class="dot ${j.state==='selesai'?'ok':j.state==='gagal'?'err':'on'}" style="display:inline-block;margin-right:6px"></span>${j.state==='selesai'?'Video skor siap':j.state==='gagal'?'Gagal':j.state==='antre'?'Menunggu':'Membuat video skor '+j.progress+'%'}</span>
      <span style="font-family:var(--f-mono);font-size:12px">${esc(j.state==='selesai'?j.out:j.state==='gagal'?j.error:j.file)}</span>
    </li>`).join('')}</ul>` : ''}`;
}

// ── Overlay Settings ──────────────────────────────────────────────────────────
let activeOverlayTab = 1;
let fullConfig = {};

async function loadFullConfig() {
  const r = await api('/api/admin/config');
  if (!r || !r.config) return;
  fullConfig = r.config;
  renderOverlayTab(activeOverlayTab);
}

function switchOverlayTab(n) {
  activeOverlayTab = n;
  $('overlayTabs').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===n-1));
  renderOverlayTab(n);
}

function renderOverlayTab(n) {
  const el = $('overlayContent'); if (!el) return;
  const court = (fullConfig.courts||[]).find(c=>c.id===n);
  if (!court) { el.innerHTML='<p style="color:var(--muted)">Tidak ada data.</p>'; return; }
  const ov = court.overlay || {};
  el.innerHTML = `
    <div class="grid2">
      <label>Nama Lapangan<input type="text" id="oName${n}" value="${esc(court.name||'')}"></label>
      <label>Posisi Overlay
        <select id="oPos${n}">
          ${['top-left','top-right','bottom-left','bottom-right'].map(p=>`<option${ov.position===p?' selected':''}>${p}</option>`).join('')}
        </select>
      </label>
      <label>Skala (1.0 = normal)<input type="number" id="oScale${n}" value="${ov.scale||1}" step="0.1" min="0.5" max="3"></label>
      <label>Offset detik (sinkroni)<input type="number" id="oOffset${n}" value="${ov.offset_seconds||0}" step="0.1"></label>
      <label>Preset encoding
        <select id="oPreset${n}">
          ${['ultrafast','superfast','veryfast','faster','fast','medium'].map(p=>`<option${ov.preset===p?' selected':''}>${p}</option>`).join('')}
        </select>
      </label>
      <label>CRF (kualitas, 18-28)<input type="number" id="oCrf${n}" value="${ov.crf||21}" min="14" max="32"></label>
    </div>
    <div class="row3">
      <button class="btn primary" onclick="saveOverlay(${n})">Simpan Pengaturan</button>
    </div>
    <div id="overlayMsg${n}" hidden></div>`;
}

async function saveOverlay(n) {
  const msg = $('overlayMsg'+n);
  const payload = { courts: [{ id: n,
    name: $('oName'+n).value,
    overlay: {
      position: $('oPos'+n).value,
      scale: parseFloat($('oScale'+n).value),
      offset_seconds: parseFloat($('oOffset'+n).value),
      preset: $('oPreset'+n).value,
      crf: parseInt($('oCrf'+n).value)
    }
  }]};
  const r = await api('/api/admin/config', payload);
  msg.hidden = false;
  if (r && r.ok) { msg.className='msg ok'; msg.textContent='Tersimpan!'; await loadFullConfig(); }
  else { msg.className='msg err'; msg.textContent=r?.message||'Gagal menyimpan.'; }
  setTimeout(() => msg.hidden=true, 3000);
}

// ── Password / PIN ────────────────────────────────────────────────────────────
async function changeAdminPw() {
  const pw = $('newAdminPw').value;
  const cf = $('confirmAdminPw').value;
  const msg = $('adminPwMsg');
  msg.hidden = false;
  if (pw !== cf) { msg.className='msg err'; msg.textContent='Password tidak cocok!'; return; }
  if (pw.length < 6) { msg.className='msg err'; msg.textContent='Password minimal 6 karakter.'; return; }
  const r = await api('/api/admin/change-password', {type:'admin', new_password:pw});
  if (r && r.ok) { msg.className='msg ok'; msg.textContent='Password berhasil diubah!'; $('newAdminPw').value=''; $('confirmAdminPw').value=''; }
  else { msg.className='msg err'; msg.textContent=r?.message||'Gagal.'; }
  setTimeout(() => msg.hidden=true, 4000);
}

async function changePin() {
  const cid = $('pinCourtSel').value;
  const pin = $('newPin').value;
  const msg = $('pinMsg');
  msg.hidden = false;
  if (!/^\d{4}$/.test(pin)) { msg.className='msg err'; msg.textContent='PIN harus tepat 4 digit angka.'; return; }
  const r = await api('/api/admin/change-password', {type:'court', court_id:parseInt(cid), new_pin:pin});
  if (r && r.ok) { msg.className='msg ok'; msg.textContent=`PIN Lapangan ${cid} berhasil diubah!`; $('newPin').value=''; }
  else { msg.className='msg err'; msg.textContent=r?.message||'Gagal.'; }
  setTimeout(() => msg.hidden=true, 4000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  await refreshStatus();
  await loadFullConfig();
  [1,2,3].forEach(n => renderCamTab(n));
  renderRecTab(1);
  renderOverlayTab(1);
}

init();
setInterval(async () => {
  await refreshStatus();
  renderCamTab(activeCamTab);
  renderRecTab(activeRecTab);
}, 3000);
</script>
</body>
</html>
